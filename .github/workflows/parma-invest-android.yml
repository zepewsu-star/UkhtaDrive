name: Build Parma Invest APK

on:
  push:
    branches:
      - parma-invest-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Restore Android app sources
        run: tar -xJf ParmaInvest/project.tar.xz
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon -p ParmaInvest assembleDebug
      - name: Publish installer
        uses: actions/upload-artifact@v4
        with:
          name: ParmaInvest-debug-APK
          path: ParmaInvest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
