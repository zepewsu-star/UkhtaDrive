name: Build Parma Invest APK

on:
  push:
    branches:
      - parma-invest-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile installable APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Restore Android app sources
        run: tar -xJf ParmaInvest/project.tar.xz
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 from runner
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace -p ParmaInvest assembleDebug
      - name: Publish installer
        uses: actions/upload-artifact@v4
        with:
          name: ParmaInvest-debug-APK
          path: ParmaInvest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
