name: Build Parma Invest Native APK
on:
  push:
    branches: [parma-invest-android]
    paths:
      - 'ParmaInvestNative/**'
      - '.github/workflows/parma-invest-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble native APK
        run: gradle --no-daemon -p ParmaInvestNative assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ParmaInvest-Native-v091-debug-APK
          path: ParmaInvestNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
